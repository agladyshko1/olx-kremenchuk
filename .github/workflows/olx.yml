name: OLX Kremenchuk

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хвилин (GitHub може запускати із затримкою)
  workflow_dispatch:          # кнопка ручного запуску

permissions:
  contents: write

concurrency:
  group: olx-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Перевірити OLX
        run: python check_olx.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_URL: ${{ secrets.OLX_URL }}

      - name: Зберегти список побачених оголошень
        run: |
          git config user.name "olx-bot"
          git config user.email "olx-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
